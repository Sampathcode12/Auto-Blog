# Generate Xcode project on a Mac: brew install xcodegen && cd ios && xcodegen generate
name: AutoBlog
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "5.0"
targets:
  AutoBlog:
    type: application
    platform: iOS
    sources:
      - path: AutoBlog
        excludes:
          - "**/.DS_Store"
          - "**/Info.plist"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.example.autoblog.ios
      INFOPLIST_FILE: AutoBlog/Info.plist
      TARGETED_DEVICE_FAMILY: "1,2"
